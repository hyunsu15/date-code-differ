<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>사용설명서 캡처용</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 1280px; height: 800px; overflow: hidden; background: #0d1117; }
      #wrap { position: relative; width: 1280px; height: 800px; }
      iframe { width: 1280px; height: 800px; border: 0; display: block; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      .box {
        position: absolute;
        border: 3px solid #ff3b30;
        border-radius: 6px;
        box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.25);
      }
      .num {
        position: absolute;
        width: 26px; height: 26px;
        border-radius: 50%;
        background: #ff3b30;
        color: #fff;
        font: 700 15px/26px -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <iframe id="app" src="/"></iframe>
      <div id="ov"></div>
    </div>
    <script type="module">
      /* docs/사용설명서.md 의 스크린샷을 만드는 페이지. `npm run shots` 가 이걸 연다.
       *
       * 개발 서버가 서빙하므로 **앱과 같은 출처**다. 그래서 iframe 안의 실제 요소 좌표를
       * 그대로 읽어 그 위에 박스를 얹을 수 있다 — 좌표를 손으로 적어 두면 UI 가 조금만
       * 움직여도 박스가 엉뚱한 데를 가리키게 된다.
       *
       * 버튼 하나만 잘라 찍지 않는다. 화면 전체를 담은 뒤 그 위에 빨간 박스와 번호를
       * 얹는다 — 잘라낸 버튼만 보면 "이게 화면 어디에 붙어 있지" 를 알 수 없다
       * (ai/부가내용.md 의 캡처 규칙). */

      const params = new URLSearchParams(location.search)
      const scene = params.get('scene') ?? 'overview'

      const seed = (env = { left: 'prod', right: 'prod' }, excludeFile = '', mode = 'code') => {
        // 프리셋을 고른 상태로 두면 **저장값이 아니라 프리셋의 현재 값**이 쓰인다
        // (features/settings/sourceSettings.ts). 제외 목록을 넣을 때는 풀어 둬야 먹는다.
        localStorage.setItem(
          'cd-source',
          JSON.stringify({
            presetId: excludeFile ? null : 'local',
            source: { mode: 'local', root: './sample-code', encoding: 'auto', excludeFile },
          })
        )
        localStorage.setItem('cd-env', JSON.stringify(env))
        localStorage.setItem('cd-theme', 'dark')
        localStorage.setItem('cd-scope', 'changed')
        // 앞선 촬영이 남긴 값이 다음 장면으로 새면 엉뚱한 화면을 찍는다 — 매번 못 박는다
        localStorage.setItem('cd-mode', mode)
        localStorage.removeItem('cd-env-linked')
        localStorage.removeItem('cd-report-kind')
        localStorage.removeItem('cd-date-list')
        localStorage.removeItem('cd-my-exclude')
        localStorage.removeItem('cd-my-exclude-schema')
        localStorage.removeItem('cd-schema-kinds')
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

      /** 조건이 참이 될 때까지 기다린다 (헤드리스에서 렌더가 끝났는지 알기 위해) */
      async function until(fn, tries = 120) {
        for (let i = 0; i < tries; i++) {
          try {
            const v = fn()
            if (v) return v
          } catch {}
          await sleep(100)
        }
        return null
      }

      /** iframe 안에서 텍스트로 요소 찾기 */
      const byText = (doc, sel, text) =>
        [...doc.querySelectorAll(sel)].find((e) => (e.textContent ?? '').includes(text))

      const setSelect = (el, value) => {
        const setter = Object.getOwnPropertyDescriptor(el.constructor.prototype, 'value').set
        setter.call(el, value)
        el.dispatchEvent(new el.ownerDocument.defaultView.Event('change', { bubbles: true }))
      }

      /** 요소 위에 빨간 박스와 번호를 얹는다. pad 로 여유를 준다 */
      function mark(doc, sel, n, pad = 6) {
        const el = typeof sel === 'string' ? doc.querySelector(sel) : sel
        if (!el) return false
        const r = el.getBoundingClientRect()
        const ov = document.getElementById('ov')

        const box = document.createElement('div')
        box.className = 'box'
        box.style.left = `${r.left - pad}px`
        box.style.top = `${r.top - pad}px`
        box.style.width = `${r.width + pad * 2}px`
        box.style.height = `${r.height + pad * 2}px`
        ov.appendChild(box)

        if (n) {
          const num = document.createElement('div')
          num.className = 'num'
          num.textContent = String(n)
          num.style.left = `${Math.max(2, r.left - pad - 13)}px`
          num.style.top = `${Math.max(2, r.top - pad - 13)}px`
          ov.appendChild(num)
        }
        return true
      }

      const SCENES = {
        /* 1. 전체 화면 — 어느 영역이 무엇인지 */
        async overview(doc) {
          mark(doc, '.snapshot-picker', 1)
          mark(doc, '.package-band', 2, 4)
          mark(doc, '.summary', 3, 4)
          mark(doc, '.filelist', 4, 4)
          mark(doc, '.split-panes', 5, 3)
        },

        /* 2. 위치 설정 패널 */
        async settings(doc) {
          byText(doc, 'button', '위치')?.click()
          await until(() => doc.querySelector('.settings .preset-list'))
          await sleep(400)
          mark(doc, '.settings .preset-list', 1, 4)
          mark(doc, '.settings-body .field', 2, 4)
          mark(doc, byText(doc, '.settings-body .field', '제외 목록 파일'), 3, 4)
          mark(doc, byText(doc, '.settings button', '적용'), 4, 5)
        },

        /* 3. 좌우 환경·날짜 고르기 */
        async picker(doc) {
          const picks = doc.querySelectorAll('.snapshot-picker .pick')
          const sels = doc.querySelectorAll('.snapshot-picker .env-select')
          mark(doc, sels[0], 1, 4)
          mark(doc, picks[0].querySelector('input'), 2, 4)
          mark(doc, sels[1], 3, 4)
          mark(doc, picks[1].querySelector('input'), 4, 4)
          mark(doc, '.snapshot-picker .env-link', 5, 4)
          mark(doc, byText(doc, 'button', '새로고침'), 6, 4)
        },

        /* 4. 운영 ↔ 테스트 */
        async crossenv(doc) {
          mark(doc, '.snapshot-picker', 1)
          mark(doc, '.pane-head.left', 2, 4)
          mark(doc, '.pane-head.right', 3, 4)
        },

        /* 5. 패키지 밴드에서 파일 목록까지 */
        async files(doc) {
          mark(doc, '.package-band', 1, 4)
          mark(doc, '.filter', 2, 4)
          mark(doc, '.filelist .file-item', 3, 4)
        },

        /* 8. 스키마 비교 — 어느 영역이 무엇인지 */
        async schema(doc) {
          mark(doc, '.mode-tabs', 1, 4)
          mark(doc, '.snapshot-picker', 2)
          mark(doc, '.schema-band .package-chips', 3, 4)
          mark(doc, byText(doc, '.optionbar .group', '종류'), 4, 4)
          mark(doc, '.filelist', 5, 4)
          mark(doc, '.schema-view .schema-section', 6, 4)
          mark(doc, '.schema-legend', 7, 3)
        },

        /* 7. 제외 목록으로 접어 둔 파일 — 펼친 상태로 찍는다 */
        async exclude(doc) {
          const toggle = await until(() => doc.querySelector('.excl-toggle'))
          toggle?.click()
          const folded = await until(() => doc.querySelector('.file-item.excluded'))
          // 접힌 파일은 경로순으로 목록 아래쪽에 있어 그냥 찍으면 화면 밖이다
          folded?.scrollIntoView({ block: 'center' })
          await sleep(400)
          mark(doc, '.excl-toggle', 1, 5)
          mark(doc, folded, 2, 4)
        },

        /* 9. 보고서 내려받기 — 본 버튼(지금 탭의 보고서)과 ▾ 메뉴(소스 · 스키마 · 통합).
              비교가 끝나 버튼이 살아난 뒤 메뉴를 펼쳐 찍는다 */
        async report(doc) {
          const main = '.report-split .btn:not(.report-caret)'
          await until(() => !doc.querySelector(main)?.disabled)
          doc.querySelector('.report-caret')?.click()
          await until(() => doc.querySelector('.report-menu'))
          await sleep(300)
          mark(doc, main, 1, 3)
          mark(doc, '.report-caret', 2, 3)
          mark(doc, '.report-menu', 3, 4)
        },

        /* 10. 날짜 고르기 목록 — 왼쪽 칸을 열어 변경 이력(이전 → 이후 한 쌍씩)이 들어온 뒤 찍는다 */
        async dates(doc) {
          const input = doc.querySelector('.pick.left input')
          await until(() => !input.disabled)
          input.click()
          await until(() => doc.querySelector('.date-menu .date-row.k-changed'))
          await sleep(300)
          const segs = doc.querySelectorAll('.date-menu .date-tools .seg')
          mark(doc, segs[0], 1, 3)
          mark(doc, segs[1], 2, 3)
          mark(doc, '.date-menu .date-row.k-changed', 3, 2)
        },

        /* 6. 코드 비교 화면 */
        async diff(doc) {
          mark(doc, '.optionbar', 1, 3)
          mark(doc, '.split-panes', 2, 3)
          mark(doc, byText(doc, 'button', '코드 검색'), 3, 4)
        },
      }

      const ENV = {
        crossenv: { left: 'prod', right: 'test' },
        report: { left: 'prod', right: 'test' },
        schema: { left: 'prod', right: 'test' },
      }

      /** 스키마 화면을 찍는 장면들 — 씨앗과 기다릴 것이 다르다 */
      const SCHEMA_SCENES = new Set(['schema'])

      /** 제외 기능은 규칙 파일을 가리켜야 보인다 — 저장소에 함께 든 견본을 쓴다 */
      const EXCLUDE = {
        exclude: './sample-code/exclude.txt',
      }

      seed(ENV[scene], EXCLUDE[scene] ?? '', SCHEMA_SCENES.has(scene) ? 'schema' : 'code')

      const frame = document.getElementById('app')
      frame.src = '/'

      await new Promise((r) => frame.addEventListener('load', r, { once: true }))
      const doc = frame.contentDocument

      // 비교가 끝나 목록이 뜰 때까지 기다린다 (스키마는 테이블 목록이다)
      await until(() => doc.querySelector('.filelist .file-item'))

      if (SCHEMA_SCENES.has(scene)) {
        // 표가 그려질 때까지 기다린다 — 목록만 뜬 상태로 찍으면 오른쪽이 비어 보인다
        await until(() => doc.querySelector('.schema-rows .srow'))
        await sleep(600)
      } else if (scene !== 'settings') {
        // 좌우가 모두 차 있는 파일을 연다.
        // 삭제된 파일을 고르면 오른쪽 칸이 비어서, 설명서에 실으면 "왜 한쪽이 비었지" 로 읽힌다.
        const items = [...doc.querySelectorAll('.filelist .file-item')]
        const changed = items.find((e) => e.querySelector('.badge.s-modified')) ?? items[0]
        changed?.click()
        await until(() => doc.querySelector('.split-panes'))
        await sleep(600)
      }

      await SCENES[scene](doc)
      await sleep(300)
      document.title = `shot-ready-${scene}`
    </script>
  </body>
</html>
